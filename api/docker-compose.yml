services:
  postgres:
    image: postgres:16-alpine
    container_name: fandza-postgres
    environment:
      POSTGRES_DB: fandza
      POSTGRES_USER: fandza
      POSTGRES_PASSWORD: fandza
    ports:
      - "5432:5432"
    volumes:
      - fandza_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fandza -d fandza"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fandza_pgdata:
