spring:
  application:
    name: Fandza
  datasource:
    url: ${FANDZA_DB_URL:jdbc:postgresql://localhost:5432/fandza}
    username: ${FANDZA_DB_USER:fandza}
    password: ${FANDZA_DB_PASSWORD:fandza}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ssXXX
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${FANDZA_KEYCLOAK_ISSUER:http://localhost:8081/realms/fandza}

server:
  port: 8080

fandza:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  admin:
    email: ${FANDZA_ADMIN_EMAIL:}
    password: ${FANDZA_ADMIN_PASSWORD:}
    full-name: ${FANDZA_ADMIN_FULL_NAME:Administrator}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
